exclude: |-
  (?x)^(
    dist/.*
  )$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-json
  - id: check-yaml
  - id: check-added-large-files
  - id: check-case-conflict
  - id: pretty-format-json
    args: [--autofix, --indent=2, --no-ensure-ascii]
    exclude: ^package-lock\.json$
- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v3.1.0
  hooks:
  - id: prettier

- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v10.6.0
  hooks:
  - id: eslint

- repo: https://github.com/lalten/check-gha-pinning
  rev: v1.3.1
  hooks:
  - id: check-gha-pinning

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.0
  hooks:
  - id: markdownlint
    args: [--fix]
    exclude: |-
      (?x)^(
        package-lock.json
      )

- repo: https://github.com/renovatebot/pre-commit-hooks
  rev: 43.256.0
  hooks:
  - id: renovate-config-validator

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell
    exclude: (?x)^( package-lock.json )

- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    args: ["--strict", "-c=.yamllint.yaml"]

- repo: https://github.com/google/yamlfmt
  rev: v0.21.0
  hooks:
  - id: yamlfmt

- repo: local
  hooks:
  - id: package-dist
    name: package dist bundle
    entry: npm run package
    language: system
    pass_filenames: false
    files: ^(src/.*|package\.json|package-lock\.json|tsconfig\.json)$
